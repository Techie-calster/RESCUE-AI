[project]
name = "rescue-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaurav Kumar", email = "gauravkumar23200200@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "folium>=0.20.0",
    "ipykernel>=7.3.0",
    "streamlit>=1.64.0",
